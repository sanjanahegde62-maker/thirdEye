# Test database — separate in-memory DB so tests are fully isolated
spring.datasource.url=jdbc:h2:mem:thirdeye_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 console in tests
spring.h2.console.enabled=false

# CORS
thirdeye.cors.allowed-origins=http://localhost:5174
